{% extends "base.html" %}
{% block title %}Reset Password · SDM System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Reset Password</h1>
                <p class="text-muted small">Choose a new password for your account.</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input class="form-control" type="password" name="new_password" minlength="6" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input class="form-control" type="password" name="confirm_password" minlength="6" required>
                    </div>
                    <button class="btn btn-primary w-100">Set New Password</button>
                </form>
                <hr>
                <p class="small text-muted mb-0"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
